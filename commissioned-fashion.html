    <script src="script.js"></script>
    <script>
        (function () {
            var galleries = [];

            function initGallery(wrapper) {
                var track = wrapper.querySelector('.scroll-gallery-track');
                var slides = wrapper.querySelectorAll('.scroll-gallery-slide');
                var imgs = wrapper.querySelectorAll('img');
                var translateX = 0;

                function centerFirstImage() {
                    var firstImg = imgs[0];
                    var firstImgWidth = firstImg.getBoundingClientRect().width;
                    var leftPad = Math.max(0, (window.innerWidth - firstImgWidth) / 2);
                    track.style.paddingLeft = leftPad + 'px';
                }

                function setHeight() {
                    var overscroll = track.scrollWidth - window.innerWidth;
                    wrapper.style.height = (window.innerHeight + overscroll) + 'px';
                }

                function updateFocus(tx) {
                    var viewCenter = window.innerWidth / 2;
                    var closestSlide = null;
                    var closestDist = Infinity;
                    slides.forEach(function (slide) {
                        var center = slide.offsetLeft + slide.offsetWidth / 2 + tx;
                        var dist = Math.abs(center - viewCenter);
                        if (dist < closestDist) { closestDist = dist; closestSlide = slide; }
                    });
                    slides.forEach(function (slide) {
                        slide.classList.toggle('focused', slide === closestSlide);
                    });
                }

                function update() {
                    var rect = wrapper.getBoundingClientRect();
                    var totalScrollable = wrapper.offsetHeight - window.innerHeight;
                    var scrolled = -rect.top;
                    var progress = Math.max(0, Math.min(1, scrolled / totalScrollable));
                    var maxTranslate = track.scrollWidth - window.innerWidth;
                    translateX = -progress * maxTranslate;
                    track.style.transform = 'translateX(' + translateX + 'px)';
                    updateFocus(translateX);
                }

                function init() {
                    centerFirstImage();
                    setHeight();
                    update();
                }

                // Wait for all images in this gallery to load
                var loaded = 0;
                imgs.forEach(function (img) {
                    function ready() { loaded++; if (loaded === imgs.length) init(); }
                    if (img.complete) { ready(); }
                    else { img.addEventListener('load', ready); img.addEventListener('error', ready); }
                });

                galleries.push({ wrapper: wrapper, track: track, slides: slides, imgs: imgs, init: init, update: update });
            }

            document.querySelectorAll('.scroll-gallery-wrapper').forEach(initGallery);

            window.addEventListener('scroll', function () {
                galleries.forEach(function (g) { g.update(); });
            }, { passive: true });

            window.addEventListener('resize', function () {
                galleries.forEach(function (g) {
                    g.track.style.paddingLeft = '0px';
                    g.init();
                });
            });
        })();
    </script>
